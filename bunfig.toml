# bunfig.toml — maximal estate project default (bun-scaffold standard).
# Proven patterns from oh-my-pi + vendored/bun + DelendAI.

telemetry = false

[install]
exact = true
linker = "hoisted"
saveTextLockfile = true
# Supply-chain / coordination window (estate convention). Tune per project.
minimumReleaseAge = 259200 # 3 days in seconds
minimumReleaseAgeExcludes = [
  "@types/bun",
  "@types/node",
  "bun-types",
  "typescript",
  "zod",
  "@modelcontextprotocol/sdk",
]

[loader]
".md" = "text"
".py" = "text"
".lark" = "text"

[test]
coverage = true
# bun test does NOT honor .gitignore; prune heavy/scratch dirs so a root-level
# `bun test` never walks into them.
pathIgnorePatterns = [
  "**/node_modules/**",
  "**/.git/**",
  "**/target/**",
  "**/dist/**",
  "**/out/**",
  "docs/**",
  "runs/**",
  ".wt/**",
  ".worktrees/**",
  "bazel-*/**",
  "**/bazel-out/**",
  ".ffs/**",
]

[coverage]
lines = 85
functions = 85
statements = 85
branches = 70
reporter = "text"

[run]
bun = true

[env]
BUN_BASE_URL = "https://staging.example.com"
BUN_CONCURRENCY = "8"